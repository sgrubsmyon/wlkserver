# Same-origin production site for wlkserver: the SvelteKit build at /, the API
# under /api/. See deployment/README.md ("Same-origin deployment behind nginx").
#
# Install as /etc/nginx/sites-available/wlkserver and link it into
# sites-enabled. Replace wlk.example.lan with the server's LAN hostname.

# Plain HTTP is only a redirect; there is no unencrypted API access.
server {
    listen 80;
    listen [::]:80;
    server_name wlk.example.lan;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wlk.example.lan;

    # Internal CA, created by deployment/make_tls_cert.sh. Clients must trust
    # /etc/ssl/wlkserver/ca.pem - a public CA cannot verify a LAN name.
    ssl_certificate     /etc/ssl/wlkserver/server.crt;
    ssl_certificate_key /etc/ssl/wlkserver/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:wlk_tls:10m;

    add_header X-Content-Type-Options nosniff always;

    # Article pictures are uploaded through the API.
    client_max_body_size 10m;

    # Built SvelteKit client (adapter-static). For an SPA build fall back to
    # "/200.html" instead of 404; for adapter-node proxy / to the node port.
    root  /var/www/wlkserver;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }

    # The trailing slash in proxy_pass strips /api; uvicorn's --root-path /api
    # puts the prefix back into generated URLs (/docs, /openapi.json).
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # DSFinV-K and TSE exports
    }
}
